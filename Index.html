<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presto Delivery</title>
    <style>
        :root {
            --primary: #8A2BE2;
            --secondary: #00E676;
            --dark: #121212;
            --light: #FFFFFF;
            --gray: #333333;
        }
        body { font-family: sans-serif; margin: 0; background: var(--dark); color: var(--light); }
        header { background: var(--gray); padding: 1rem; display: flex; align-items: center; justify-content: space-between; }
        .logo-container { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 1.5rem; }
        .logo-wing { transform: scaleX(-1); display: inline-block; color: var(--secondary); }
        nav button { background: none; border: 1px solid var(--primary); color: var(--light); padding: 8px 16px; cursor: pointer; border-radius: 4px; }
        nav button:hover { background: var(--primary); }
        section { padding: 20px; display: none; }
        .active { display: block; }
        form { display: flex; flex-direction: column; gap: 10px; max-width: 400px; }
        input, select { padding: 10px; border-radius: 4px; border: 1px solid #555; background: #222; color: #fff; }
        button.submit-btn { background: var(--secondary); color: #000; border: none; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #444; padding: 10px; text-align: left; }
        th { background: var(--primary); }
    </style>
</head>
<body>

<header>
    <div class="logo-container">
        P<span class="logo-wing">RESTO</span> Delivery
    </div>
    <nav>
        <button onclick="showSection('empresas')">Registro Empresas</button>
        <button onclick="showSection('motorizados')">Portal Motorizados</button>
        <button onclick="showSection('admin')">Administración</button>
    </nav>
</header>

<section id="empresas" class="active">
    <h2>Registro para Empresas Aliadas</h2>
    <form id="empresaForm" onsubmit="registrarEmpresa(event)">
        <input type="text" id="empName" placeholder="Nombre de la Empresa" required>
        <input type="email" id="empEmail" placeholder="Correo Corporativo" required>
        <input type="text" id="empPhone" placeholder="Teléfono de Contacto" required>
        <button type="submit" class="submit-btn">Registrar Empresa</button>
    </form>
</section>

<section id="motorizados">
    <h2>Portal y Registro de Motorizados</h2>
    <form id="motoForm" onsubmit="registrarMotorizado(event)">
        <input type="text" id="motoNombre" placeholder="Nombre Completo" required>
        <input type="text" id="motoCedula" placeholder="Cédula de Identidad" required>
        <label>Foto de Rostro:</label>
        <input type="file" id="motoFoto" accept="image/*" required>
        <label>Licencia de Conducir:</label>
        <input type="file" id="motoLicencia" accept="image/*" required>
        <label>Foto de la Moto:</label>
        <input type="file" id="motoMoto" accept="image/*" required>
        <button type="submit" class="submit-btn">Enviar Documentos para Validación</button>
    </form>
</section>

<section id="admin">
    <h2>Panel de Administración Presto</h2>
    
    <h3>Configuración Bancaria (Dueño)</h3>
    <form id="bankForm" onsubmit="guardarBanco(event)">
        <input type="text" id="bankName" placeholder="Nombre del Banco" required>
        <input type="text" id="bankAccount" placeholder="Número de Cuenta" required>
        <input type="text" id="bankPhone" placeholder="Teléfono Pago Móvil" required>
        <input type="text" id="bankID" placeholder="Cédula / RIF Jurídico" required>
        <button type="submit" class="submit-btn" style="background:var(--primary); color:white;">Guardar Datos Bancarios</button>
    </form>

    <h3 style="margin-top:30px;">Base de Datos de Motorizados</h3>
    <table id="motoTable">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Cédula</th>
                <th>Estado</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody id="motoTableBody"></tbody>
    </table>
</section>

<script>
    function showSection(id) {
        document.querySelectorAll('section').forEach(sec => sec.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    let motorizados = [];

    function registrarMotorizado(e) {
        e.preventDefault();
        const nombre = document.getElementById('motoNombre').value;
        const cedula = document.getElementById('motoCedula').value;
        motorizados.push({ name: nombre, cedula: cedula, status: 'Pendiente' });
        alert('Documentos enviados exitosamente.');
        document.getElementById('motoForm').reset();
        actualizarTablaAdmin();
    }

    function registrarEmpresa(e) {
        e.preventDefault();
        alert('Empresa registrada con éxito.');
        document.getElementById('empresaForm').reset();
    }

    function guardarBanco(e) {
        e.preventDefault();
        alert('Datos bancarios actualizados.');
    }

    function actualizarTablaAdmin() {
        const tbody = document.getElementById('motoTableBody');
        tbody.innerHTML = '';
        motorizados.forEach((m, index) => {
            tbody.innerHTML += `
                <tr>
                    <td>${m.name}</td>
                    <td>${m.cedula}</td>
                    <td>${m.status}</td>
                    <td><button onclick="aprobarMotorizado(${index})">Aprobar</button></td>
                </tr>
            `;
        });
    }

    function aprobarMotorizado(index) {
        motorizados[index].status = 'Aprobado';
        actualizarTablaAdmin();
        alert('Motorizado aprobado.');
    }
</script>

</body>
</html>
